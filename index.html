<script>
/* 微信桥接：head 最先执行，桥若已就绪则轮询等 <audio> 后解静音抢播 */
function __wxUnlock(){
  var iv=setInterval(function(){
    var a=document.getElementById('bgm');
    if(a){clearInterval(iv);
      try{
        if(typeof WeixinJSBridge=='object'&&typeof WeixinJSBridge.invoke=='function'){
          try{WeixinJSBridge.invoke('getNetworkType',{},function(){});}catch(e){}
        }
        a.muted=false;
        var p=a.play();
        if(p&&p.catch)p.catch(function(){a.muted=true;try{a.play();}catch(e){}});
      }catch(e){}
    }
  },50);
  setTimeout(function(){clearInterval(iv);},3000);
}
if(typeof WeixinJSBridge=='object'&&typeof WeixinJSBridge.invoke=='function'){
  __wxUnlock();
}else if(document.addEventListener){
  document.addEventListener('WeixinJSBridgeReady',function(){__wxUnlock();},false);
}else if(document.attachEvent){
  document.attachEvent('onWeixinJSBridgeReady',__wxUnlock);
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0d1a;font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(620px 620px at 18% 16%, rgba(255,80,140,.20), transparent 62%),
    radial-gradient(720px 720px at 82% 28%, rgba(120,80,255,.18), transparent 62%),
    radial-gradient(700px 700px at 50% 90%, rgba(255,150,50,.12), transparent 62%);
  animation:bgmove 16s ease-in-out infinite alternate;}
@keyframes bgmove{0%{transform:scale(1) translate(0,0);opacity:.75}
  100%{transform:scale(1.18) translate(-1.5%,-2%);opacity:1}}
.fh{position:fixed;bottom:-60px;z-index:0;opacity:.15;pointer-events:none;
  animation:floatUp linear infinite;will-change:transform;filter:saturate(1.2)}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0) rotate(0)}
  50%{transform:translateY(-55vh) translateX(var(--sway)) rotate(22deg)}
  100%{transform:translateY(-118vh) translateX(calc(var(--sway)*-1)) rotate(-14deg)}}
.card{
  position:absolute;min-width:136px;max-width:196px;border-radius:13px;
  box-shadow:0 12px 28px rgba(0,0,0,.42),0 0 20px var(--glow);
  border:1.5px solid rgba(255,255,255,.75);
  opacity:0;transform:scale(.15) rotate(var(--rot0));
  transition:left .95s cubic-bezier(.25,.46,.45,.94),top .95s cubic-bezier(.25,.46,.45,.94),
             opacity .5s ease,transform .6s cubic-bezier(.22,1.7,.36,1);
  pointer-events:none;z-index:1;will-change:transform,left,top;
}
.card.show{opacity:1;transform:scale(1) rotate(var(--rot0))}
.card.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.card.float{animation:floaty var(--dur) ease-in-out infinite alternate}
@keyframes floaty{0%{transform:translateY(0) rotate(var(--rot0))}
  100%{transform:translateY(-9px) rotate(calc(var(--rot0) + 2.5deg))}}
.titlebar{display:flex;align-items:center;gap:4px;padding:6px 10px;background:rgba(255,255,255,.78);
  border-radius:13px 13px 0 0;font-size:11px;color:#6b2138;white-space:nowrap;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:inset 0 -1px 2px rgba(0,0,0,.15)}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.title-text{margin-left:6px;letter-spacing:.4px}
.body{padding:13px 15px;font-size:15.5px;font-weight:800;color:#4a0d28;text-align:center;line-height:1.45;
  text-shadow:0 1px 1px rgba(255,255,255,.35)}
#halo{position:fixed;left:50%;top:50%;z-index:0;pointer-events:none;border-radius:50%;
  background:radial-gradient(circle,rgba(255,120,170,.55) 0%,rgba(255,60,120,.28) 35%,transparent 70%);
  opacity:0;transform:translate(-50%,-50%) scale(.3);
  transition:opacity .9s ease;filter:blur(2px)}
#halo.on{opacity:1;animation:haloBeat 1.15s ease-in-out infinite}
@keyframes haloBeat{0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.12)}}
.burst{position:absolute;z-index:50;pointer-events:none;font-size:15px;
  animation:fly 1.3s cubic-bezier(.08,.7,.25,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.2);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(2);opacity:0}}
#flash{position:fixed;inset:0;z-index:95;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.95),
    rgba(255,175,222,.6) 38%, rgba(255,70,160,.16) 72%, transparent 90%)}
#flash.on{animation:flashFX .7s ease-out forwards}
@keyframes flashFX{0%{opacity:0;transform:scale(.55)}
  16%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.18)}}
#tapPill{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);z-index:99998;
  padding:11px 24px;border-radius:40px;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,190,228,.6);color:#ffd9eb;font-size:15px;font-weight:800;
  letter-spacing:2px;backdrop-filter:blur(8px);text-shadow:0 0 12px rgba(255,120,190,.9);
  box-shadow:0 0 24px rgba(255,80,160,.45);pointer-events:none;white-space:nowrap;
  animation:pillPulse 1s ease-in-out infinite}
@keyframes pillPulse{0%,100%{transform:translateX(-50%) scale(1);box-shadow:0 0 16px rgba(255,80,160,.4)}
  50%{transform:translateX(-50%) scale(1.09);box-shadow:0 0 40px rgba(255,80,160,.9)}}
#tapPill.hide{opacity:0;transform:translateX(-50%) scale(.5);transition:opacity .45s,transform .45s;animation:none}
/* ---- 歌词发光大字收尾（全屏视觉冲击） ---- */
#finale{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;pointer-events:none;overflow:hidden;
  perspective:900px;transform-style:preserve-3d;
  background:radial-gradient(ellipse at 50% 55%, rgba(52,10,52,.7), rgba(13,13,26,.35) 75%)}
#beams{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;
  transform:translate(-50%,-50%);opacity:.5;filter:blur(6px);pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,120,190,.16) 0deg 5deg,
    rgba(255,80,160,.04) 5deg 14deg,transparent 14deg 30deg);
  animation:beamsRot 12s linear infinite}
@keyframes beamsRot{0%{transform:translate(-50%,-50%) rotate(0)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
/* 双色 3D 环绕冲击环：粉环+青环整体沿纵深轨迹，下穿上/上穿下，与文字前后交错 */
.ring{position:absolute;left:50%;top:50%;width:30vmin;height:30vmin;
  pointer-events:none;transform-style:preserve-3d;opacity:0;
  will-change:transform,opacity}
.ring .rp,.ring .rb{position:absolute;border-radius:50%}
.ring .rp{inset:-3px;border:3.5px solid rgba(255,120,195,.95);
  box-shadow:0 0 30px rgba(255,90,175,.95),inset 0 0 22px rgba(255,140,205,.6)}
.ring .rb{inset:-11px;border:3.5px solid rgba(120,195,255,.92);
  box-shadow:0 0 34px rgba(90,175,255,.85),inset 0 0 26px rgba(150,210,255,.55)}
/* 上穿：从文字下方(前景)升到文字上方(背景) */
.ring.hoopUp{animation:hoopUp 1.5s cubic-bezier(.45,.05,.5,1) both}
@keyframes hoopUp{
  0%{opacity:0;transform:translate(-50%,calc(-50% + 40vmin)) translateZ(160px) rotateX(80deg) scale(.5)}
  16%{opacity:1}
  55%{transform:translate(-50%,-50%) translateZ(20px) rotateX(76deg) scale(1)}
  100%{opacity:0;transform:translate(-50%,calc(-50% - 48vmin)) translateZ(-170px) rotateX(76deg) scale(1.12)}}
/* 下穿：从文字上方(背景)降到文字下方(前景) */
.ring.hoopDown{animation:hoopDown 1.5s cubic-bezier(.45,.05,.5,1) both}
@keyframes hoopDown{
  0%{opacity:0;transform:translate(-50%,calc(-50% - 42vmin)) translateZ(-170px) rotateX(80deg) scale(.5)}
  16%{opacity:1}
  55%{transform:translate(-50%,-50%) translateZ(-20px) rotateX(76deg) scale(1)}
  100%{opacity:0;transform:translate(-50%,calc(-50% + 42vmin)) translateZ(170px) rotateX(76deg) scale(1.12)}}
body.shake{animation:shakeS .55s linear}
@keyframes shakeS{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-12px,7px)}30%{transform:translate(10px,-9px)}
  45%{transform:translate(-8px,-6px)}60%{transform:translate(8px,5px)}
  75%{transform:translate(-5px,4px)}90%{transform:translate(3px,-2px)}}
.fline{font-size:clamp(28px,7.6vw,68px);font-weight:900;letter-spacing:.1em;white-space:nowrap;
  color:#ffe9f3;transition:opacity .5s ease;position:relative;transform-style:preserve-3d;
  text-shadow:0 0 12px rgba(255,120,180,1),0 0 32px rgba(255,70,155,.9),
             0 0 70px rgba(255,40,140,.65),0 4px 14px rgba(0,0,0,.5)}
.fline.on{animation:glowPulse 1.5s ease-in-out infinite}
@keyframes glowPulse{0%,100%{text-shadow:0 0 12px rgba(255,120,180,1),0 0 32px rgba(255,70,155,.9),0 0 70px rgba(255,40,140,.65),0 4px 14px rgba(0,0,0,.5)}
  50%{text-shadow:0 0 20px rgba(255,150,200,1),0 0 60px rgba(255,80,170,1),0 0 110px rgba(255,50,150,.9),0 4px 14px rgba(0,0,0,.5)}}
.fline .ch{display:inline-block;opacity:0;color:#ffe9f3;
  animation:charPop .7s cubic-bezier(.16,1.4,.4,1) both}
@keyframes charPop{0%{opacity:0;transform:translateY(90px) rotateY(85deg) scale(.1)}
  55%{opacity:1;transform:translateY(-8px) rotateY(-8deg) scale(1.22)}
  100%{opacity:1;transform:translateY(0) rotateY(0) scale(1)}}
#fsub{margin-top:22px;color:rgba(255,232,244,.92);font-size:clamp(13px,2.4vw,18px);
  font-weight:600;letter-spacing:.5em;opacity:0;transition:opacity 1.4s ease;
  text-shadow:0 0 18px rgba(255,90,160,.85),0 0 40px rgba(255,60,140,.5)}
#fsub.on{opacity:1}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:12.5px;z-index:9999;pointer-events:none;transition:opacity .6s}
#hint.hide{opacity:0}
#musicBtn{position:fixed;bottom:16px;right:16px;z-index:99999;width:46px;height:46px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.25);cursor:pointer;background:rgba(255,255,255,.14);
  backdrop-filter:blur(6px);font-size:21px;display:flex;align-items:center;justify-content:center;
  transition:background .3s,transform .2s;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#musicBtn:hover{background:rgba(255,255,255,.3);transform:scale(1.1)}
#musicTip{position:fixed;bottom:72px;right:16px;z-index:99998;color:rgba(255,255,255,.38);
  font-size:10.5px;text-align:right;pointer-events:none;transition:opacity .5s}
#musicTip.hide{opacity:0}
#brand{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:9998;color:rgba(255,255,255,.55);
  font-size:14px;font-weight:700;letter-spacing:3px;pointer-events:none;
  text-shadow:0 0 18px rgba(255,90,150,.6);white-space:nowrap}
</style>
</head>
<body>
<div id="bgfx"></div>
<div id="halo"></div>
<div id="flash"></div>
<div id="finale"><div id="beams"></div><div class="fline" id="fl1"></div><div class="fline" id="fl2"></div><div id="fsub"></div></div>
<audio id="bgm" autoplay muted loop playsinline preload="auto" style="display:none"></audio>
<div id="brand">❤ 温馨提示 · 万事顺意 ❤</div>
<div id="tapPill">✨ 点击一下，愿你开心一整天哦 ✨</div>
<button id="musicBtn" title="音乐开 / 关">🔊</button>
<div id="musicTip">梁博《安然无恙》· 高潮 2:00-3:20 循环<br>音乐自动播放中…</div>
<div id="hint">循环播放中 · 点击可立即重播</div>

<script>
/* ========== 文案 & 配色 ========== */
const TIPS=[
  "多喝水呀~","保持好心情","好好爱自己","前程似锦","梦想成真",
  "早点休息","别熬夜","要健康","好运连连","暴富发财",
  "万事如意","心想事成","注意保暖","愿所有烦恼都消失","顺顺利利",
  "要幸福","笑口常开","天天开心","记得吃水果","多吃点好的",
  "你是最棒的","今天也要加油","愿你被温柔以待","一切都会好起来","平安喜乐",
  "每天都要元气满满","要好好吃饭","天冷了多穿衣服","愿你眼里有光","所求皆如愿"
];
const GRADS=[
  ["#FFA6B5","#FF5E7E"],["#FFC3A0","#FF8A5C"],["#FFEDB3","#FFD24D"],["#B7F0AD","#7BD88F"],
  ["#A9DEF9","#63B4FF"],["#E3C6FF","#B388FF"],["#FFC2E2","#FF7EB6"],["#C4F5E0","#7FE0B8"],
  ["#FFE0A6","#FFBB4D"],["#C9D4FF","#8FA8FF"],["#FFC9C9","#FF8A8A"],["#D9F7BE","#A8E063"],
  ["#FDE2FF","#E9A8FF"],["#BDE0FE","#6FA8DC"],["#FFF1C1","#FFD166"],["#FADADD","#F2A0A8"]
];
const GLOWS=["rgba(255,94,126,.45)","rgba(255,138,92,.4)","rgba(255,210,77,.4)","rgba(123,216,143,.4)",
  "rgba(99,180,255,.4)","rgba(179,136,255,.42)","rgba(255,126,182,.42)","rgba(127,224,184,.4)",
  "rgba(255,187,77,.4)","rgba(143,168,255,.4)","rgba(255,138,138,.4)","rgba(168,224,99,.4)",
  "rgba(233,168,255,.42)","rgba(111,168,220,.4)","rgba(255,209,102,.4)","rgba(242,160,168,.4)"];
const TOTAL=100;
const PAUSE_AFTER_HEART=4500;
const BURST_GLYPHS=["❤","💗","✨","💖","⭐","💕","🌟","💘","💫","🔥"];
const L1="乌云会离开你的胸膛";
const L2="岁月会爱你如常";
const L1DELAY=L1.length*90+450;
const FINALE_HOLD=5200;

/* ========== 工具 ========== */
function heartPt(t,s,cx,cy){
  const x=16*Math.pow(Math.sin(t),3);
  const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
  return{x:cx+x*s,y:cy+y*s};
}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function rand(a,b){return a+Math.random()*(b-a)}
function vib(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){}}

/* ========== 氛围层 ========== */
(function(){
  const g=["❤","💗","💕","💛","💙","✨"];
  for(let i=0;i<16;i++){
    const s=document.createElement("span");
    s.className="fh";s.textContent=pick(g);
    s.style.left=rand(0,100)+"vw";
    s.style.fontSize=rand(12,30)+"px";
    s.style.animationDuration=rand(11,24)+"s";
    s.style.animationDelay=(-rand(0,24))+"s";
    s.style.setProperty("--sway",rand(-6,6)+"vw");
    document.body.appendChild(s);
  }
})();

/* ========== 全屏粉光闪屏 ========== */
const flashEl=document.getElementById("flash");
function flashOnce(){
  flashEl.classList.remove("on");void flashEl.offsetWidth;flashEl.classList.add("on");
}
function bigFlash(){flashOnce();setTimeout(flashOnce,240);setTimeout(flashOnce,480);}

/* ========== 点击提醒（视觉 + 语音） ========== */
const pill=document.getElementById("tapPill");
function hidePill(){pill.classList.add("hide");}
const SAY="点击一下，愿你开心一整天哦";
function speakInvite(){
  try{
    if(!("speechSynthesis" in window))return;
    if(speechSynthesis.speaking||speechSynthesis.pending)return;
    const u=new SpeechSynthesisUtterance(SAY);
    u.lang="zh-CN";u.rate=1.0;u.pitch=1.15;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(x=>(x.lang||"").toLowerCase().indexOf("zh")===0)||null;
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ========== 歌词发光收尾 ========== */
const finale=document.getElementById("finale");
const fl1=document.getElementById("fl1");
const fl2=document.getElementById("fl2");
const fsub=document.getElementById("fsub");
let finaleT=[];
function buildChars(el,text){
  el.innerHTML="";
  for(let i=0;i<text.length;i++){
    const sp=document.createElement("span");
    sp.className="ch";sp.textContent=text[i];
    sp.style.animationDelay=(i*90)+"ms";
    el.appendChild(sp);
  }
}
function cancelFinale(){
  finaleT.forEach(t=>clearTimeout(t));finaleT=[];
  finale.style.display="none";
  fl1.innerHTML="";fl2.innerHTML="";fsub.classList.remove("on");
}
let ringTick=0;
function spawnRing(){
  const r=document.createElement("div");
  r.className="ring";
  r.innerHTML="<i class='rp'></i><i class='rb'></i>";
  r.classList.add(ringTick%2===0?"hoopUp":"hoopDown");
  ringTick++;
  finale.appendChild(r);
  setTimeout(()=>r.remove(),1700);
}
/* 全屏冲击：闪光 + 冲击波环 + 漫天粒子 + 震动 + 屏幕抖动 */
function impact(x,y,big){
  flashOnce();
  spawnRing();
  if(big){setTimeout(spawnRing,130);setTimeout(spawnRing,290);}
  const dmax=Math.max(W(),H())*0.62;
  burst(x,y,big?170:130,50,dmax);
  vib(big?[40,60,120]:[50,80]);
  document.body.classList.add("shake");
  setTimeout(()=>document.body.classList.remove("shake"),620);
}
function showFinale(cx,cy){
  if(running)return;
  cancelFinale();
  finale.style.display="flex";
  fl2.style.opacity="0";
  buildChars(fl1,L1);
  impact(cx,cy-80,false);
  finaleT.push(setTimeout(function(){fl1.classList.add("on");},L1.length*90+750));
  finaleT.push(setTimeout(function(){
    fl2.style.opacity="1";
    buildChars(fl2,L2);
    impact(cx,cy+90,true);
  },L1DELAY));
  finaleT.push(setTimeout(function(){
    fl2.classList.add("on");
    fsub.textContent="— 安然无恙 · 愿你永远安然无恙 —";
    fsub.classList.add("on");
    flashOnce();
    burst(cx,cy,70,60,Math.max(W(),H())*0.5);
  },L1DELAY+L2.length*90+750));
  finaleT.push(setTimeout(function(){
    finale.style.display="none";
    fl1.innerHTML="";fl2.innerHTML="";fsub.classList.remove("on");
    fl1.classList.remove("on");fl2.classList.remove("on");
    finaleT=[];
    if(!running){clearAll();start();}
  },L1DELAY+L2.length*90+FINALE_HOLD));
}

/* ========== 背景音乐（免点击自动起播） ========== */
const AUDIO_URL="https://music.163.com/song/media/outer/url?id=2698807244.mp3";
const CS=120, CE=200;
const audio=document.getElementById("bgm");
audio.src=AUDIO_URL;
let ready=false;
audio.addEventListener("loadedmetadata",()=>{ready=true;try{audio.currentTime=CS;}catch(e){}});
audio.addEventListener("timeupdate",()=>{
  if(ready&&(audio.currentTime>=CE||audio.currentTime<CS-0.5))audio.currentTime=CS;
});
function makeAudible(){
  audio.muted=false;
  const p=audio.play();
  if(p&&p.catch)p.catch(()=>{
    audio.muted=true;
    const q=audio.play();
    if(q&&q.catch)q.catch(()=>{});
  });
  setTimeout(()=>{
    const audible=(!audio.muted&&!audio.paused&&audio.currentTime>0);
    refreshBtn();
    if(audible){hidePill();document.getElementById("musicTip").classList.add("hide");}
  },150);
}
function bootAudio(){
  audio.muted=true;
  const p=audio.play();
  if(p&&p.catch)p.catch(()=>{});
  setTimeout(makeAudible,120);
  setTimeout(makeAudible,600);
  setTimeout(makeAudible,1500);
  setTimeout(makeAudible,3200);
}
function refreshBtn(){
  const b=document.getElementById("musicBtn");
  b.textContent=(!audio.muted&&!audio.paused&&audio.currentTime>0)?"\u{1F507}":"\u{1F50A}";
}
function toggleMusic(){
  if(audio&&!audio.paused&&!audio.muted){audio.pause();refreshBtn();}
  else{makeAudible();hidePill();}
}
document.getElementById("musicBtn").addEventListener("click",function(e){
  e.stopPropagation();toggleMusic();
});
document.addEventListener("pointerdown",function(){
  hidePill();
  if(audio.paused||audio.muted)makeAudible();
});
document.addEventListener("touchstart",function(){
  hidePill();
  if(audio.paused||audio.muted)makeAudible();
},{passive:true});

/* ========== 卡片动画 ========== */
let cards=[],count=0,running=false;
const W=()=>window.innerWidth, H=()=>window.innerHeight;
const halo=document.getElementById("halo");

function makeCard(x,y,tip,gi,n){
  const d=document.createElement("div");
  const rot=rand(-5,5);
  d.className="card";
  d.style.left=x+"px";d.style.top=y+"px";
  d.style.background="linear-gradient(165deg,"+GRADS[gi][0]+","+GRADS[gi][1]+")";
  d.style.setProperty("--glow",GLOWS[gi]);
  d.style.setProperty("--rot0",rot+"deg");
  d.innerHTML='<div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>'
    +'<span class="title-text">\u6E29\u99A8\u63D0\u793A ('+n+'/100)</span></div>'
    +'<div class="body">'+tip+'</div>';
  document.body.appendChild(d);
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add("show")));
  return d;
}
function burst(cx,cy,n,dmin,dmax){
  if(dmin===undefined)dmin=90;
  if(dmax===undefined)dmax=420;
  for(let i=0;i<n;i++){
    const s=document.createElement("span");
    s.className="burst";s.textContent=pick(BURST_GLYPHS);
    const a=Math.random()*Math.PI*2,d=rand(dmin,dmax);
    s.style.left=(cx-10)+"px";s.style.top=(cy-10)+"px";
    s.style.setProperty("--tx",Math.cos(a)*d+"px");
    s.style.setProperty("--ty",Math.sin(a)*d+"px");
    s.style.fontSize=rand(14,36)+"px";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1400);
  }
}
function clearAll(){
  cards.forEach(c=>c.el.remove());cards=[];count=0;
  finaleT.forEach(t=>clearTimeout(t));finaleT=[];
  finale.style.display="none";
  fl1.innerHTML="";fl2.innerHTML="";fsub.classList.remove("on");
}

function start(){
  if(running)return;running=true;
  cancelFinale();
  clearAll();
  const w=W(),h=H(),cx=w/2,cy=h/2-8;
  const s=Math.min(w,h)/42;
  const hint=document.getElementById("hint");
  hint.classList.add("hide");
  halo.classList.remove("on");
  halo.style.width=halo.style.height=(s*36)+"px";
  halo.style.left="50%";halo.style.top="50%";

  const N=42,pts=[];
  for(let i=0;i<N;i++){const t=i/N*2*Math.PI;const p=heartPt(t,s,cx,cy);pts.push(p);}
  let idx=0;
  const iv=setInterval(()=>{
    if(idx>=N){
      clearInterval(iv);
      bigFlash();
      halo.classList.add("on");
      cards.forEach(c=>c.el.classList.add("pulse"));
      vib([60,50,120]);
      burst(cx,cy,100);
      setTimeout(()=>burst(cx,cy,100),240);
      setTimeout(()=>burst(cx,cy,100),480);
      setTimeout(()=>{vib(90);},500);
      setTimeout(()=>{
        cards.forEach(c=>c.el.classList.remove("pulse"));
        halo.classList.remove("on");
        scatter();
      },PAUSE_AFTER_HEART);
      return;
    }
    const p=pts[idx];count++;
    const gi=Math.floor(Math.random()*GRADS.length);
    const el=makeCard(p.x-72,p.y-30,pick(TIPS),gi,Math.min(count,TOTAL));
    cards.push({el});
    idx++;
  },72);

  function scatter(){
    cards.forEach((c,i)=>{
      setTimeout(()=>{
        const rx=rand(8,w-190),ry=rand(8,h-96);
        c.el.style.left=rx+"px";c.el.style.top=ry+"px";
        c.el.style.zIndex=Math.floor(rand(2,60));
        c.el.style.setProperty("--dur",rand(2.5,4.5)+"s");
        c.el.classList.add("float");
      },i*22);
    });
    let added=cards.length;
    const av=setInterval(()=>{
      if(added>=TOTAL){
        clearInterval(av);running=false;
        /* 散开结束 → 卡片淡出 → 歌词发光收尾 → 自动重播 */
        setTimeout(()=>{
          cards.forEach(c=>c.el.style.opacity="0");
          setTimeout(()=>{
            if(!running){clearAll();showFinale(w/2,h*0.42);}
          },520);
        },1600);
        return;
      }
      const rx=rand(8,w-190),ry=rand(8,h-96);count++;
      const gi=Math.floor(Math.random()*GRADS.length);
      const el=makeCard(rx,ry,pick(TIPS),gi,Math.min(count,TOTAL));
      el.style.zIndex=Math.floor(rand(2,60));
      el.style.setProperty("--dur",rand(2.5,4.5)+"s");
      setTimeout(()=>el.classList.add("float"),600);
      cards.push({el});
      added++;
    },55);
  }
}

/* ========== 启动 ========== */
window.addEventListener("load",function(){
  start();
  vib(60);
  bootAudio();
  setTimeout(speakInvite,700);
  setTimeout(speakInvite,1800);
  setTimeout(speakInvite,3200);
});
document.addEventListener("WeixinJSBridgeReady",function(){makeAudible();speakInvite();},false);
document.addEventListener("visibilitychange",function(){
  if(!document.hidden&&(audio.paused||audio.muted))makeAudible();
});
document.body.addEventListener("click",function(e){
  if(e.target.id==="musicBtn"||e.target.closest("#musicBtn"))return;
  hidePill();
  cancelFinale();
  clearAll();running=false;start();
});
window.addEventListener("resize",function(){
  if(!running){cancelFinale();clearAll();start();}
});
</script>
